# Frozen (orchestrator; the app lane edits on request). Generate the Xcode project with
# `xcodegen generate --spec App/project.yml`; the .xcodeproj, Info.plist and entitlements it writes are not committed.
# This file is the single source of truth for targets, settings, version and build number.
# Source lists are per lane folder: a lane adds files inside its folder without touching this file.
name: RadaresAnunciados
options:
  bundleIdPrefix: io.github.geiserx
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: es
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # Version and build number live only here. Bump CURRENT_PROJECT_VERSION for every TestFlight upload.
    MARKETING_VERSION: 0.1.2
    CURRENT_PROJECT_VERSION: 3
    DEVELOPMENT_TEAM: 624WUVM8B4
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  RadaresCore:
    path: ..

targets:
  RadaresAnunciados:
    type: application
    platform: iOS
    sources:
      # app lane
      - path: Sources/RadaresApp.swift
      - path: Sources/AppDelegate.swift
      - path: Sources/Data
      - path: Sources/Health
      - path: Sources/UI
      - path: Sources/PrivacyInfo.xcprivacy
      - path: Sources/Localizable.xcstrings
      - path: Sources/InfoPlist.xcstrings
      - path: Sources/Assets.xcassets
      # the bundled feed snapshot, its date and the notification tick (design 5.3, 4.2)
      - path: Sources/Resources
        buildPhase: resources
      # location lane
      - path: Sources/Location
      # surfaces lane
      - path: Sources/Surfaces
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Radares Anunciados
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # The CarPlay driving-task scene (design 4.5): its icon on the CarPlay Home Screen is what lets iOS mirror the
        # warning's notification on the car screen. The phone's window scene stays SwiftUI's own (no entry here).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Design 3.2: location keeps the drive loop alive, audio lets the warning speak from the background,
        # fetch runs the 6-hourly feed refresh.
        UIBackgroundModes: [location, audio, fetch]
        NSLocationWhenInUseUsageDescription: Para calcular la distancia y el sentido hacia los radares anunciados.
        NSLocationAlwaysAndWhenInUseUsageDescription: "Para avisarte en el coche sin abrir la app: se despierta al moverse y solo usa el GPS mientras conduces. La ubicación nunca sale del teléfono."
        NSLocationAlwaysUsageDescription: "Para avisarte en el coche sin abrir la app: se despierta al moverse y solo usa el GPS mientras conduces. La ubicación nunca sale del teléfono."
        NSMotionUsageDescription: Para saber si vas en coche y no gastar batería cuando caminas.
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.geiserx.radares.refresh
    entitlements:
      path: Sources/Radares.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        # Granted by Apple on 2026-10-07; the App ID and the App Store profile carry the capability (docs/CARPLAY.md).
        com.apple.developer.carplay-driving-task: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.geiserx.radares
        # iPhone only. Set per target: XcodeGen's target default ("1,2") overrides the project-level value.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Radares App Store
    dependencies:
      - package: RadaresCore
        product: RadaresCore

  # App-side unit tests: what runs without Core Location (the fix rule, the persisted drive, the drive counters,
  # the notification rules, the health merge). `xcodebuild test` on a simulator; CI runs it on every push.
  RadaresAnunciadosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RadaresAnunciados
      - package: RadaresCore
        product: RadaresCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.geiserx.radares.tests
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

schemes:
  RadaresAnunciados:
    build:
      targets:
        RadaresAnunciados: all
        RadaresAnunciadosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RadaresAnunciadosTests
    archive:
      config: Release
