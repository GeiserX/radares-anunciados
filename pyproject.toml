[project]
name = "radares-anunciados"
version = "0.1.0"
description = "Speed radars announced in Spain (police weekly lists, DGT, OpenStreetMap) as one feed, synced to Home Assistant zones."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13",
]

[project.scripts]
radares = "radares_anunciados.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radares_anunciados"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
