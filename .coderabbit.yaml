language: "en-US"
tone_instructions: "Be direct and concise. No fluff."

reviews:
  profile: "chill"
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
  path_filters:
    - "!dist/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!.venv/**"
    - "!uv.lock"
  path_instructions:
    - path: "src/**"
      instructions: |
        Every source must keep its license and attribution (DGT data is CC BY 4.0,
        OpenStreetMap data is ODbL). Flag any code that detects, receives or jams
        radar signals: the project only reads published positions.
        Check that HTTP calls set a timeout.
    - path: "tests/**"
      instructions: |
        Tests must run offline against fixtures, never against live sources.
    - path: "Dockerfile*"
      instructions: |
        Check for a non-root USER and pinned base image tags, never :latest.
  tools:
    gitleaks:
      enabled: true
    ruff:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "local"
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
