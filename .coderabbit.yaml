language: "en-US"
tone_instructions: "Be direct and concise. No fluff."

reviews:
  profile: "chill"
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
  path_filters:
    - "!*.xcodeproj/**"
    - "!**/*.xcodeproj/**"
    - "!DerivedData/**"
    - "!.build/**"
    - "!.swiftpm/**"
    - "!Package.resolved"
    - "!**/Package.resolved"
  path_instructions:
    - path: "**/*.swift"
      instructions: |
        The app warns from published radar positions only. Flag any code that
        detects, receives or jams radar signals. Every radar shown must keep
        the source and attribution the feed gives it. Check that network calls
        set a timeout and that location is never sent anywhere: there is no
        server and no account.
    - path: "**/Tests/**"
      instructions: |
        Tests must run offline against fixtures, never against the live feed.
    - path: "project.yml"
      instructions: |
        This is the source of truth for the Xcode project. The generated
        .xcodeproj is never committed.
  tools:
    gitleaks:
      enabled: true
    swiftlint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "local"
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
