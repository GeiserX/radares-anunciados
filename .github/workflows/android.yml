# The Android build: the :core port of Sources/RadaresCore against every route vector in Tests/RadaresCoreTests,
# on a free GitHub-hosted runner. One job named "Android" that always reports, so it can be a required check:
# when a change touches nothing Android reads, it succeeds at once. Every action is pinned by SHA.
name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter lists a PR's files through the API.
  pull-requests: read

# Never `ci-*`: concurrency groups are repo-wide and would cancel the iOS jobs of ci.yml.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gradle runs plugin and dependency code; nothing here pushes, so the token stays out of .git/config.
          persist-credentials: false

      - name: Did Android's inputs change
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android:
              - 'android/**'
              - 'Tests/RadaresCoreTests/Fixtures/**'
              - 'docs/SPEC.md'
              - 'App/Sources/Resources/feed-snapshot.*'
              - '.github/workflows/android*.yml'

      - name: Nothing Android reads changed
        if: steps.changes.outputs.android != 'true'
        run: echo "No change under android/, the shared vectors, SPEC.md, the feed snapshot or the Android workflows."

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.changes.outputs.android == 'true'

      - name: No literal credentials in tracked files
        if: steps.changes.outputs.android == 'true'
        run: android/scripts/check-no-committed-credentials.sh

      - name: Build and test
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Fail when no test ran
        if: steps.changes.outputs.android == 'true'
        run: |
          executed=$(grep -E '^Executed [0-9]+ tests' "$RUNNER_TEMP/gradle.log" | tail -1 | sed -E 's/^Executed ([0-9]+) .*/\1/')
          if [ -z "$executed" ] || [ "$executed" -eq 0 ]; then
            echo "::error::no test was executed"
            exit 1
          fi
          vectors=$(ls Tests/RadaresCoreTests/Fixtures/vectors/*.json | wc -l)
          # Vectors over the road fixture carry "roadFixture": true and are skipped until the port has the road rule
          # (docs/SPEC.md section 10). Every other vector must pass, and the skips must be exactly the flagged files.
          flagged=$(grep -lE '"roadFixture": *true' Tests/RadaresCoreTests/Fixtures/vectors/*.json | wc -l)
          ran=$(grep -cE 'everyRouteVector\(\).*PASSED' "$RUNNER_TEMP/gradle.log" || true)
          skipped=$(grep -cE 'everyRouteVector\(\).*SKIPPED' "$RUNNER_TEMP/gradle.log" || true)
          echo "executed $executed tests; route vectors on disk: $vectors; passed: $ran; skipped: $skipped; flagged roadFixture: $flagged"
          if [ "$skipped" -ne "$flagged" ]; then
            echo "::error::$flagged vectors flagged roadFixture but $skipped vector tests skipped"
            exit 1
          fi
          if [ $((ran + skipped)) -ne "$vectors" ]; then
            echo "::error::$vectors vectors on disk but $ran passed and $skipped skipped"
            exit 1
          fi
